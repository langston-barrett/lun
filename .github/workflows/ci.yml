name: rust ci
on:
  push:
    branches:
    - main
  pull_request:
    # Don't run on documentation-only changes
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: langston-barrett/gha/.github/workflows/rust-ci.yml@d0cdf249a9684185d96083c87d078679cd373b28
    with:
      bench: false
      os: ubuntu-24.04
      # Run with just the automatically installed tools, see the `lint` workflow
      # for the others.
      pre-test-hook: |
        cargo run -- -v run --only-tool='cargo clippy' --only-tool='cargo fmt' --only-tool='shellcheck'
